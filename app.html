<title>MAGIK Web Sitesi Keşfi</title>
<meta name="description" content="Studio Magik web sitesi keşif formu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@300..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: split like the studiomagik.com hero. Forest rail (progress + index) left, paper working column right.
   Welcome and confirmation are full-bleed forest. Single committed look (brand is two-tone). */
:root {
  color-scheme: light;
  /* Magik Design System colors */
  --forest: #07402B;
  --forest-deep: #003723;
  --ink: #003C26;
  --ink-2: #45705F;          /* ink at ~72% on paper, 5.2:1 */
  --ink-3: #6F8C80;          /* placeholders, meta */
  --accent: #13CD89;         /* light green, used on forest only */
  --mint: #E6FFDD;           /* selected option fill */
  --paper: #F5F8F3;          /* working surface, green-biased neutral */
  --field: #FFFFFF;
  --line: rgba(0, 60, 38, 0.12);
  --line-strong: rgba(0, 60, 38, 0.28);
  --on-dark: #FFFFFF;
  --on-dark-2: rgba(255, 255, 255, 0.66);
  --on-dark-3: rgba(255, 255, 255, 0.2);
  --on-dark-4: rgba(255, 255, 255, 0.1);
  --danger: #B42318;         /* extension: the DS defines no error color */
  --danger-on-dark: #FFB4A8;

  /* Type */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Afacad Flux", "Inter", system-ui, sans-serif;
  --font-ui: "Inter", system-ui, sans-serif;
  --track: -0.006em;

  /* Radius, motion */
  --r-sm: 8px;
  --r-md: 16px;
  --r-lg: 22px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur: 220ms;
  --dur-slow: 400ms;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  letter-spacing: var(--track);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
h1, h2, h3, p, dl, dd, fieldset { margin: 0; }
fieldset { border: 0; padding: 0; min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Buttons (Magik recipes) ---------- */
.btn {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: var(--track);
  line-height: 1;
  min-height: 48px;
  padding: 0 22px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  background: transparent;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), transform 140ms var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-solid { background: var(--forest); color: #fff; border-color: var(--forest); }
.btn-solid:hover { background: var(--forest-deep); }
.btn-outline { color: var(--ink); border-color: rgba(0, 60, 38, 0.4); }
.btn-outline:hover { border-color: var(--ink); background: rgba(0, 60, 38, 0.04); }
.btn-white { background: #fff; color: var(--ink); border-color: #fff; }
.btn-white:hover { background: #F3F7F2; }
.btn-ghost-dark { color: var(--on-dark); border-color: rgba(255, 255, 255, 0.5); }
.btn-ghost-dark:hover { border-color: rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.05); }
.btn-text { min-height: 40px; padding: 0 4px; color: inherit; border-radius: var(--r-sm); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: currentColor; }
.btn[disabled] { opacity: 0.5; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.paper :focus-visible { outline-color: var(--forest); }

/* ---------- Brand marks ---------- */
.wordmark { display: block; height: 30px; width: auto; color: #fff; }
.mark { display: block; height: 28px; width: auto; color: #fff; }

/* ===================================================================
   Stage: welcome + confirmation (full-bleed forest)
   =================================================================== */
.stage {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--forest);
  color: var(--on-dark);
  display: flex;
  flex-direction: column;
}
.stage-nav {
  height: 79px;
  padding-inline: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--on-dark-4);
  flex: none;
}
.stage-nav .meta { font-size: 15px; color: var(--on-dark-2); }
.stage-body {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}
.stage-copy {
  padding: 56px 24px 48px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  max-width: 640px;
}
.eyebrow {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.4;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.stage .eyebrow { color: var(--on-dark-2); }
.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(44px, 6.4vw, 76px);
  line-height: 0.98;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.lede { font-size: 18px; line-height: 1.45; color: var(--on-dark-2); max-width: 34em; text-wrap: pretty; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 15px; color: var(--on-dark-2); padding: 0; margin: 0; list-style: none; }
.facts li { display: flex; align-items: center; gap: 8px; }
.facts li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.facts strong { color: #fff; font-weight: 600; }
.cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }

.stage-aside {
  border-top: 1px solid var(--on-dark-4);
  padding: 32px 24px 48px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.toc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--on-dark-4); max-width: 560px; width: 100%; }
.toc li {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 12px;
  align-items: baseline;
  padding: 13px 0;
  border-bottom: 1px solid var(--on-dark-4);
  font-size: 16px;
}
.toc .n { font-variant-numeric: tabular-nums; color: var(--on-dark-2); font-size: 15px; }
.toc .c { color: var(--on-dark-2); font-size: 15px; font-variant-numeric: tabular-nums; }
.toc-cap { font-size: 15px; color: var(--on-dark-2); margin-bottom: 14px; }

.resume {
  border: 1px solid var(--on-dark-3);
  border-radius: var(--r-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 520px;
  background: rgba(255, 255, 255, 0.04);
}
.resume-title { font-size: 19px; font-weight: 600; line-height: 1.15; }
.resume-meta { color: var(--on-dark-2); font-size: 16px; }
.meter { height: 4px; border-radius: 4px; background: var(--on-dark-4); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width var(--dur-slow) var(--ease); }
.confirm-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font-size: 16px; color: var(--on-dark-2); }

@media (min-width: 960px) {
  .stage-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stage-copy { padding: 88px 48px 64px; justify-content: center; margin-inline: auto; width: 100%; max-width: 656px; }
  .stage-aside { border-top: 0; border-left: 1px solid var(--on-dark-4); padding: 64px 48px; justify-content: center; align-items: center; }
  .stage-aside > * { width: 100%; max-width: 560px; }
}

/* Confirmation */
.done-copy { gap: 32px; }
.sign { font-size: 19px; line-height: 1.3; }
.sign span { display: block; color: var(--on-dark-2); }
.status {
  border: 1px solid var(--on-dark-3);
  border-radius: var(--r-lg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 520px;
  width: 100%;
}
.status-row { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #F5C26B; flex: none; }
.status-dot.ok { background: var(--accent); }
.status p { color: var(--on-dark-2); font-size: 16px; }
.copy-fallback { width: 100%; min-height: 160px; background: rgba(0, 0, 0, 0.18); color: #fff; border: 1px solid var(--on-dark-3); border-radius: var(--r-sm); padding: 12px; font-size: 14px; }

/* ===================================================================
   Form shell: rail + main
   =================================================================== */
.shell { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); }

/* Mobile/tablet top bar */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--forest);
  color: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.topbar-step { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.topbar-step b { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-step span { font-size: 13px; color: var(--on-dark-2); font-variant-numeric: tabular-nums; }
.topbar .btn { min-height: 40px; padding: 0 14px; }
.topbar-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--on-dark-4); }
.topbar-progress span { display: block; height: 100%; background: var(--accent); transition: width var(--dur-slow) var(--ease); }

.rail {
  background: var(--forest);
  color: #fff;
  display: none;
  flex-direction: column;
  gap: 28px;
  padding: 28px 24px 24px;
}
.rail.open {
  display: flex;
  position: fixed;
  inset: 0;
  z-index: 30;
  overflow-y: auto;
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}
.rail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rail-close { display: inline-flex; }
.rail .eyebrow { color: var(--on-dark-2); font-size: 13px; }
.nav { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.nav button {
  width: 100%;
  display: grid;
  grid-template-columns: 30px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  margin-inline: -10px;
  width: calc(100% + 20px);
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--on-dark-2);
  text-align: left;
  cursor: pointer;
  font-size: 15px;
  line-height: 1.25;
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.nav button:hover:not([disabled]) { background: rgba(255, 255, 255, 0.06); color: #fff; }
.nav button[disabled] { cursor: default; color: rgba(255, 255, 255, 0.36); }
.nav .n { font-size: 14px; font-variant-numeric: tabular-nums; }
.nav [aria-current="step"] { color: #fff; background: rgba(255, 255, 255, 0.1); font-weight: 600; }
.nav .st { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--on-dark-2); }
.nav .st svg { width: 14px; height: 14px; color: var(--accent); }
.nav .st.miss { color: var(--danger-on-dark); }
.nav .st.miss::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid var(--on-dark-4); }
.rail-stat { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; color: var(--on-dark-2); }
.rail-stat b { color: #fff; font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.save-note { font-size: 13px; color: var(--on-dark-2); line-height: 1.35; display: flex; gap: 8px; align-items: flex-start; }
.save-note::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
.save-note.warn::before { background: #F5C26B; }

@media (min-width: 1024px) {
  .shell { grid-template-columns: 320px minmax(0, 1fr); }
  .topbar { display: none; }
  .rail, .rail.open {
    display: flex;
    position: sticky;
    inset: auto;
    top: 0;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    z-index: auto;
    padding: 28px 28px 24px;
  }
  .rail-close { display: none; }
}

/* Main column */
.main { min-width: 0; display: flex; flex-direction: column; background: var(--paper); }
.content {
  width: 100%;
  max-width: 760px;
  margin-inline: auto;
  padding: 40px 20px 32px;
  flex: 1;
}
@media (min-width: 720px) { .content { padding: 64px 40px 48px; } }
.step-enter { animation: enter var(--dur-slow) var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.sec-head { display: flex; flex-direction: column; gap: 16px; padding-bottom: 36px; }
.sec-head .eyebrow { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.sec-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 5vw, 54px); line-height: 0.98; letter-spacing: -0.02em; text-wrap: balance; }
.sec-intro { font-size: 17px; line-height: 1.45; color: var(--ink-2); max-width: 36em; text-wrap: pretty; }
.legend-note { font-size: 14px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }

/* Question blocks */
.q { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-slow) var(--ease), opacity var(--dur) var(--ease); }
.q > .q-inner { min-height: 0; overflow: hidden; }
.q.collapsed { grid-template-rows: 0fr; opacity: 0; }
.q.collapsed > .q-inner { visibility: hidden; transition: visibility 0s linear var(--dur-slow); }
.q-body { padding-block: 30px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.q.sub .q-body { border-top: 0; padding-top: 0; padding-left: 20px; position: relative; }
.q.sub .q-body::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 2px;
  width: 10px;
  height: 12px;
  border-left: 1px solid var(--line-strong);
  border-bottom: 1px solid var(--line-strong);
}
.q-label {
  display: block;
  float: left;
  width: 100%;
  padding: 0;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.35;
  text-wrap: pretty;
}
.q-label + * { clear: both; }
.q.sub .q-label { font-size: 16px; }
.q-num { display: block; font-size: 14px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.q-ctx { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.tag {
  display: inline-block;
  vertical-align: 3px;
  margin-left: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1;
  padding: 5px 8px 5px;
  border-radius: 6px;
  white-space: nowrap;
}
.tag-req { background: var(--forest); color: #fff; }
.tag-opt { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
.q-hint { font-size: 14px; color: var(--ink-2); line-height: 1.4; }
.q-err { font-size: 14px; color: var(--danger); font-weight: 500; display: none; align-items: center; gap: 8px; }
.q.invalid .q-err { display: flex; }
.q-err::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

/* Inputs */
.input {
  width: 100%;
  background: var(--field);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  padding: 13px 16px;
  font-size: 16px;
  line-height: 1.4;
  color: var(--ink);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  -webkit-appearance: none;
  appearance: none;
}
.input::placeholder { color: var(--ink-3); opacity: 1; }
.input:hover { border-color: rgba(0, 60, 38, 0.5); }
.input:focus { outline: none; border-color: var(--forest); box-shadow: inset 0 0 0 1px var(--forest); }
.input:focus-visible { outline: none; }
.q.invalid .input { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.textarea { resize: vertical; min-height: 104px; display: block; }
.textarea.short { min-height: 64px; }
input[type="date"].input { max-width: 260px; min-height: 52px; }
.field-row { display: flex; gap: 10px; align-items: center; }
.prefix { font-size: 16px; color: var(--ink-3); }

/* Option tiles */
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.opts-inline { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); max-width: 520px; }
.opt {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 14px;
  background: var(--field);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 15px;
  line-height: 1.35;
  transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.opt[hidden] { display: none !important; }
.opt:hover { border-color: rgba(0, 60, 38, 0.55); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.opt .ind {
  flex: none;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  border: 1.5px solid rgba(0, 60, 38, 0.55);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #fff;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.opt .ind::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform var(--dur) var(--ease); }
.opt input[type="checkbox"] + .ind { border-radius: 4px; }
.opt input[type="checkbox"] + .ind::after {
  width: 9px; height: 5px; border-radius: 0; background: transparent;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: translateY(-1px) rotate(-45deg) scale(0);
}
.opt:has(input:checked) { background: var(--mint); border-color: var(--forest); box-shadow: inset 0 0 0 1px var(--forest); }
.opt input:checked + .ind { background: var(--forest); border-color: var(--forest); }
.opt input:checked + .ind::after { transform: scale(1); }
.opt input[type="checkbox"]:checked + .ind::after { transform: translateY(-1px) rotate(-45deg) scale(1); }
.opt:has(input:focus-visible) { outline: 2px solid var(--forest); outline-offset: 2px; }
.q.invalid .opt { border-color: rgba(180, 35, 24, 0.6); }

.reveal { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-slow) var(--ease), opacity var(--dur) var(--ease); }
.reveal > div { min-height: 0; overflow: hidden; }
.reveal.collapsed { grid-template-rows: 0fr; opacity: 0; }
.reveal.collapsed > div { visibility: hidden; transition: visibility 0s linear var(--dur-slow); }
.reveal .input { margin-top: 4px; }

/* Action bar */
.actions {
  position: sticky;
  bottom: 0;
  z-index: 10;
  background: rgba(245, 248, 243, 0.94);
  border-top: 1px solid var(--line);
  padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
}
@supports (backdrop-filter: blur(8px)) { .actions { backdrop-filter: blur(8px); } }
.actions-in { max-width: 760px; margin-inline: auto; display: flex; align-items: center; gap: 12px; }
@media (min-width: 720px) { .actions-in { padding-inline: 20px; } }
.actions .spacer { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: center; }
.actions .msg { color: var(--danger); font-weight: 500; }
@media (max-width: 480px) {
  .actions .spacer { display: none; }
  .actions-in .btn { flex: 1; padding-inline: 14px; }
  .actions-in .btn.btn-outline { flex: 0 0 auto; }
}

/* Review */
.rv-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  margin-bottom: 20px;
}
.rv-summary > div { background: var(--field); padding: 18px 20px; display: flex; flex-direction: column; gap: 2px; }
.rv-summary b { font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.rv-summary span { font-size: 15px; color: var(--ink-2); }
.callout {
  border: 1px solid rgba(180, 35, 24, 0.35);
  background: #FFF6F4;
  border-radius: var(--r-md);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

      furthest: state.furthest,

  /* =====================================================================
     Rendering
     ===================================================================== */
  var app = document.getElementById('app');

  function render(opts) {
    opts = opts || {};
    if (state.step === 'welcome') app.innerHTML = welcomeHTML();
    else if (state.step === 'done') app.innerHTML = doneHTML();
    else app.innerHTML = shellHTML();
    if (typeof state.step === 'number' && state.step < N) {
      syncVisibility(false);
      app.querySelectorAll('textarea').forEach(autosize);
    }
    if (opts.scroll !== false) window.scrollTo(0, 0);
    if (opts.focusHeading) {
      var h = app.querySelector('[data-focus-target]');
      if (h) h.focus({ preventScroll: true });
    }
  }

  /* ---------- welcome ---------- */
  function welcomeHTML() {
    var draft = readJSON(CONFIG.draftKey);
    var resume = '';
    if (draft && draft.answers && Object.keys(draft.answers).length) {
      var prev = state.answers; state.answers = draft.answers;
      var t = totals(); state.answers = prev;
      var where = draft.step === REVIEW ? 'Gözden geçirme adımı' : (typeof draft.step === 'number' ? 'Bölüm ' + pad(draft.step + 1) + ', ' + SECTIONS[draft.step].title : 'Başlangıç');
      resume = '<div class="resume" role="region" aria-label="Kayıtlı taslak">' +
        '<div><p class="resume-title">Kaldığınız yerden devam edin</p>' +
        '<p class="resume-meta">' + esc(where) + ' · son kayıt ' + esc(relDay(draft.updatedAt)) + '</p></div>' +
        '<div class="meter" aria-hidden="true"><span style="width:' + t.pct + '%"></span></div>' +
        '<p class="resume-meta">' + t.done + ' / ' + t.total + ' soru yanıtlandı</p>' +
        (state.confirmDiscard
          ? '<div class="confirm-inline"><span>Taslak bu cihazdan silinecek.</span><button class="btn btn-white" data-act="discard-yes" type="button">Taslağı sil</button><button class="btn btn-text" data-act="discard-no" type="button" style="color:#fff">Vazgeç</button></div>'
          : '<div class="cta-row"><button class="btn btn-white" data-act="resume" type="button">Devam et ' + ICON.arrowR + '</button><button class="btn btn-text" style="color:#fff" data-act="discard" type="button">Baştan başla</button></div>') +
        '</div>';
    }
    var toc = SECTIONS.map(function (s, i) {
      var c = s.questions.filter(function (q) { return !q.sub; }).length;
      return '<li><span class="n">' + pad(i + 1) + '</span><span>' + esc(s.title) + '</span><span class="c">' + c + ' soru</span></li>';
    }).join('');

    return '<div class="stage">' +
      '<header class="stage-nav">' + WORDMARK + '<span class="meta">studiomagik.com</span></header>' +
      '<div class="stage-body">' +
        '<section class="stage-copy step-enter" aria-labelledby="w-title">' +
          '<p class="eyebrow"><span lang="en">Studio Magik</span> / Web sitesi keşfi</p>' +
          '<h1 class="display" id="w-title" tabindex="-1" data-focus-target>İşinizi ileri taşıyacak bir web sitesi kuralım.</h1>' +
          '<p class="lede">Tasarıma başlamadan önce işinizi, kitlenizi ve sizin için başarının neye benzediğini anlamak istiyoruz. Bu kısa form, web siteniz için doğru yönü ortaya çıkarmamıza yardımcı olacak.</p>' +
          '<ul class="facts"><li>Tahmini süre <strong>4–6 dakika</strong></li><li><strong>' + N + '</strong> bölüm</li><li>Yanıtlarınız bu cihazda otomatik kaydedilir</li></ul>' +
          (resume || '<div class="cta-row"><button class="btn btn-white" data-act="start" type="button">Hadi başlayalım ' + ICON.arrowR + '</button></div>') +
        '</section>' +
        '<aside class="stage-aside" aria-label="Formun bölümleri">' +
          '<p class="toc-cap">Neler soracağız</p>' +
          '<ol class="toc">' + toc + '</ol>' +
        '</aside>' +
      '</div></div>';
  }

  /* ---------- confirmation ---------- */
  function doneHTML() {
    var sub = state.submission || {};
    var delivered = sub.delivered;
    var status = delivered
      ? '<div class="status-row"><span class="status-dot ok" aria-hidden="true"></span>Studio Magik’e iletildi</div>' +
        '<p>' + esc(longDate(sub.submittedAt)) + ' tarihinde gönderildi. Bu tarayıcıda da bir kopyası saklanıyor.</p>'
      : '<div class="status-row"><span class="status-dot" aria-hidden="true"></span>Yanıtlarınız bu cihazda kayıtlı</div>' +
        '<p>Bu form henüz bir gönderim sunucusuna bağlı değil, bu yüzden yanıtlarınız Studio Magik’e otomatik olarak iletilmedi. Bize ulaşması için yanıtlarınızı kopyalayıp e-postayla ya da mesajla paylaşın.</p>';
    var copy = '<div class="cta-row"><button class="btn ' + (delivered ? 'btn-ghost-dark' : 'btn-white') + '" data-act="copy" type="button">Yanıtları kopyala</button>' +
      '<span class="resume-meta" id="copy-note" role="status"></span></div>' +
      (state.copyFallback ? '<label class="sr-only" for="copy-area">Yanıtların metni</label><textarea id="copy-area" class="copy-fallback" readonly>' + esc(answersText()) + '</textarea>' : '');

    return '<div class="stage">' +
      '<header class="stage-nav">' + WORDMARK + '<span class="meta">studiomagik.com</span></header>' +
      '<div class="stage-body">' +
        '<section class="stage-copy done-copy step-enter" aria-labelledby="d-title">' +
          '<p class="eyebrow">' + (delivered ? 'Form gönderildi' : 'Form tamamlandı') + '</p>' +
          '<h1 class="display" id="d-title" tabindex="-1" data-focus-target>Detayları paylaştığınız için teşekkürler.</h1>' +
          '<p class="lede">Yanıtlarınız hedeflerinizi anlamamıza ve web siteniz için doğru yönü belirlememize yardımcı olacak. Bir sonraki görüşmemizden önce yanıtlarınızı inceleyeceğiz.</p>' +
          '<p class="sign">Görüşmek üzere,<span>Studio Magik</span></p>' +
        '</section>' +
        '<aside class="stage-aside" aria-label="Gönderim durumu">' +
          '<div class="status">' + status + copy + '</div>' +
          '<div class="cta-row" style="margin-top:20px"><button class="btn btn-text" style="color:#fff" data-act="new" type="button">Yeni bir form başlat</button></div>' +
        '</aside>' +
      '</div></div>';
  }

  /* ---------- form shell ---------- */
  function shellHTML() {
    var isReview = state.step === REVIEW;
    var title = isReview ? 'Gözden geçir' : SECTIONS[state.step].title;
    var stepNo = isReview ? 'Son adım' : 'Bölüm ' + pad(state.step + 1) + ' / ' + N;
    var pos = isReview ? 100 : Math.round((state.step + 1) / (N + 1) * 100);
    return '<div class="shell">' +
      '<header class="topbar">' + MARK +
        '<div class="topbar-step"><span>' + stepNo + '</span><b>' + esc(title) + '</b></div>' +
        '<button class="btn btn-ghost-dark" type="button" data-act="rail-open" aria-expanded="' + state.railOpen + '" aria-controls="rail">' + ICON.menu + 'Bölümler</button>' +
        '<div class="topbar-progress" aria-hidden="true"><span style="width:' + pos + '%"></span></div>' +
      '</header>' +
      '<aside class="rail' + (state.railOpen ? ' open' : '') + '" id="rail" aria-label="Form ilerlemesi">' + railHTML() + '</aside>' +
      '<main class="main paper" id="main">' +
        '<div class="content step-enter">' + (isReview ? reviewHTML() : sectionHTML(state.step)) + '</div>' +
        actionsHTML() +
      '</main>' +
    '</div>';
  }

  function railHTML() {
    var t = totals();
    var items = SECTIONS.map(function (s, i) {
      if (!sectionShown(i)) return '';
      var current = state.step === i;
      var reachable = i <= Math.max(state.furthest, 0);
      var st = '';
      if (!current && state.visited.indexOf(i) > -1) {
        st = missingRequired(i).length ? '<span class="st miss">eksik</span>' : '<span class="st">' + ICON.check + '<span class="sr-only">tamamlandı</span></span>';
      }
      return '<li><button type="button" data-goto="' + i + '"' + (current ? ' aria-current="step"' : '') + (reachable ? '' : ' disabled') + '>' +
        '<span class="n">' + pad(i + 1) + '</span><span>' + esc(s.title) + '</span>' + st + '</button></li>';
    }).join('');
    var reviewReach = state.furthest >= REVIEW;
    items += '<li><button type="button" data-goto="' + REVIEW + '"' + (state.step === REVIEW ? ' aria-current="step"' : '') + (reviewReach ? '' : ' disabled') + '>' +
      '<span class="n">' + ICON.check.replace('<svg', '<svg width="14" height="14"') + '</span><span>Gözden geçir ve gönder</span></button></li>';

    return '<div class="rail-head">' + WORDMARK +
        '<button class="btn btn-ghost-dark rail-close" type="button" data-act="rail-close">' + ICON.close + 'Kapat</button></div>' +
      '<p class="eyebrow">Web sitesi keşfi</p>' +
      '<ol class="nav">' + items + '</ol>' +
      '<div class="rail-foot">' +
        '<div class="rail-stat"><span>Tamamlanan</span><b id="pct">%' + t.pct + '</b></div>' +
        '<div class="meter" aria-hidden="true"><span id="pct-bar" style="width:' + t.pct + '%"></span></div>' +
        '<p class="save-note' + (state.storageOk ? '' : ' warn') + '" id="save-note" role="status">' + saveNoteText() + '</p>' +
      '</div>';
  }

  function saveNoteText() {
    if (!state.storageOk) return 'Bu tarayıcı taslak kaydetmeye izin vermiyor. Sayfayı kapatırsanız yanıtlarınız kaybolur.';
    if (state.savedAt) return 'Taslak bu cihazda kaydedildi · ' + clock(state.savedAt) + '. Henüz gönderilmedi.';
    return 'Yanıtlarınız bu cihazda otomatik kaydedilir. Gönderene kadar kimseyle paylaşılmaz.';
  }
  function paintSaveNote() {
    var el = document.getElementById('save-note');
    if (!el) return;
    el.textContent = saveNoteText();
    el.classList.toggle('warn', !state.storageOk);
  }
  function paintProgress() {
    var t = totals();
    var p = document.getElementById('pct'), b = document.getElementById('pct-bar');
    if (p) p.textContent = '%' + t.pct;
    if (b) b.style.width = t.pct + '%';
  }

  function sectionHTML(i) {
    var s = SECTIONS[i];
    var intro = typeof s.intro === 'function' ? s.intro(state.answers) : s.intro;
    var hasReq = s.questions.some(function (q) { return q.req; });
    var n = 0;
    var qs = s.questions.map(function (q) {
      var num = '';
      if (!q.sub && visible(q)) { n++; num = (i + 1) + '.' + n; }
      return questionHTML(q, num);
    }).join('');
    return '<header class="sec-head">' +
        '<p class="eyebrow">Bölüm ' + pad(i + 1) + ' / ' + N + '</p>' +
        '<h1 class="sec-title" tabindex="-1" data-focus-target>' + esc(s.title) + '</h1>' +
        '<p class="sec-intro">' + esc(intro) + '</p>' +
        '<p class="legend-note">' + (hasReq ? '<span><span class="tag tag-req" style="margin-left:0">Zorunlu</span> olarak işaretli sorular dışındakileri atlayabilirsiniz.</span>' : '<span>Bu bölümde zorunlu soru yok. Yanıtlayabildiklerinizi yanıtlayın.</span>') + '</p>' +
      '</header>' +
      '<div class="qs">' + qs + '</div>';
  }

  function questionHTML(q, num) {
    var a = state.answers;
    var hintId = q.hint ? 'h-' + q.id : '';
    var errId = 'e-' + q.id;
    var described = [hintId, errId].filter(Boolean).join(' ');
    var tag = q.req ? '<span class="tag tag-req">Zorunlu</span>' : (q.opt ? '<span class="tag tag-opt">İsteğe bağlı</span>' : '');
    var pre = num ? '<span class="q-num">' + num + '</span>' : (q.ctx ? '<span class="q-ctx">' + esc(q.ctx) + '</span>' : '');
    var labelInner = pre + esc(q.label) + tag;
    var hint = q.hint ? '<p class="q-hint" id="' + hintId + '">' + esc(q.hint) + '</p>' : '';
    var err = '<p class="q-err" id="' + errId + '"></p>';
    var cls = 'q' + (q.sub ? ' sub' : '');
    var body;

    if (q.type === 'single' || q.type === 'multi') {
      var multi = q.type === 'multi';
      var cur = a[q.id];
      var opts = q.options.map(function (o) {
        var checked = multi ? (Array.isArray(cur) && cur.indexOf(o.v) > -1) : cur === o.v;
        return '<label class="opt" data-v="' + o.v + '"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="' + q.id + '" id="' + q.id + '--' + o.v + '" value="' + o.v + '"' + (checked ? ' checked' : '') + (q.req && !multi ? ' aria-required="true"' : '') + '><span class="ind" aria-hidden="true"></span><span>' + esc(o.l) + '</span></label>';
      }).join('');
      var other = q.options.some(function (o) { return o.v === 'other'; })
        ? '<div class="reveal" data-other="' + q.id + '"><div><label class="sr-only" for="' + q.id + '__other">Diğer seçeneğini belirtin</label><input class="input" type="text" id="' + q.id + '__other" data-key="' + q.id + '__other" value="' + esc(a[q.id + '__other'] || '') + '" placeholder="Lütfen belirtin" autocomplete="off"></div></div>'
        : '';
      body = '<fieldset aria-describedby="' + described + '"' + '><legend class="q-label">' + labelInner + '</legend>' +
        '<div class="q-stack" style="display:flex;flex-direction:column;gap:14px">' + hint +
        '<div class="opts' + (q.layout === 'inline' ? ' opts-inline' : '') + '">' + opts + '</div>' + other + err + '</div></fieldset>';
    } else {
      var common = ' id="' + q.id + '" data-key="' + q.id + '" aria-describedby="' + described + '"' + (q.req ? ' aria-required="true"' : '');
      var field;
      var val = esc(a[q.id] || '');
      if (q.type === 'textarea') {
        field = '<textarea class="input textarea' + (q.rows && q.rows <= 2 ? ' short' : '') + '"' + common + ' rows="' + (q.rows || 3) + '">' + val + '</textarea>';
      } else if (q.type === 'date') {
        field = '<input class="input" type="date"' + common + ' value="' + val + '">';
      } else if (q.type === 'url') {
        field = '<input class="input" type="url" inputmode="url" spellcheck="false" autocapitalize="off"' + common + ' value="' + val + '" placeholder="' + esc(q.placeholder || '') + '" autocomplete="url">';
      } else {
        field = '<input class="input" type="text"' + common + ' value="' + val + '" placeholder="' + esc(q.placeholder || '') + '" autocomplete="' + (q.autocomplete || 'off') + '">';
      }
      body = '<label class="q-label" for="' + q.id + '">' + labelInner + '</label>' + hint + field + err;
    }
    return '<div class="' + cls + '" data-q="' + q.id + '"><div class="q-inner"><div class="q-body">' + body + '</div></div></div>';
  }

  function actionsHTML() {
    var isReview = state.step === REVIEW;
    var back = '<button class="btn btn-outline" type="button" data-act="back">' + ICON.arrowL + '<span>Geri</span></button>';
    var mid = '<span class="spacer" id="action-msg" role="status">' + esc(state.formMsg || (isReview ? '' : 'Bölüm ' + (state.step + 1) + ' / ' + N)) + '</span>';
    var next;
    if (isReview) {
      next = '<button class="btn btn-solid" type="button" data-act="submit"' + (state.submitting ? ' disabled' : '') + '>' + (state.submitting ? 'Gönderiliyor…' : 'Formu gönder') + '</button>';
    } else if (state.fromReview) {
      next = '<button class="btn btn-solid" type="button" data-act="next">Gözden geçirmeye dön ' + ICON.arrowR + '</button>';
    } else {
      next = '<button class="btn btn-solid" type="button" data-act="next">' + (nextStep(state.step) === REVIEW ? 'Gözden geçir' : 'Devam et') + ' ' + ICON.arrowR + '</button>';
    }
    return '<div class="actions"><div class="actions-in">' + back + mid + next + '</div></div>';
  }

  /* ---------- review ---------- */
  function reviewHTML() {
    var t = totals();
    var missing = [];
    SECTIONS.forEach(function (s, i) { missingRequired(i).forEach(function (q) { missing.push({ i: i, q: q }); }); });

    var secs = SECTIONS.map(function (s, i) {
      if (!sectionShown(i)) return '';
      var qs = visibleQs(i);
      var done = qs.filter(answered);
      var skipped = qs.length - done.length;
      var items = qs.map(function (q) {
        if (answered(q)) return '<div><dt>' + esc(q.label) + '</dt><dd>' + esc(displayValue(q)) + '</dd></div>';
        if (q.req) return '<div><dt>' + esc(q.label) + '</dt><dd class="missing">Zorunlu, henüz yanıtlanmadı</dd></div>';
        return '';
      }).join('');
      return '<section class="rv" aria-labelledby="rv-' + i + '">' +
        '<div class="rv-head"><span class="n">' + pad(i + 1) + '</span>' +
          '<h3 id="rv-' + i + '">' + esc(s.title) + '<span class="cnt">' + done.length + ' / ' + qs.length + ' yanıtlandı</span></h3>' +
          '<button class="btn btn-outline" type="button" data-edit="' + i + '">Düzenle<span class="sr-only">: ' + esc(s.title) + '</span></button></div>' +
        (items ? '<dl>' + items + '</dl>' : '<p class="skipped" style="margin-top:0">Bu bölümde henüz yanıt yok.</p>') +
        (skipped && items ? '<p class="skipped">' + skipped + ' soru boş bırakıldı.</p>' : '') +
      '</section>';
    }).join('');

    var callout = missing.length
      ? '<div class="callout" role="alert"><h3>Göndermeden önce ' + missing.length + ' zorunlu soruyu yanıtlayın</h3><ul>' +
        missing.map(function (m) { return '<li><button type="button" data-edit="' + m.i + '" data-focus-q="' + m.q.id + '">' + pad(m.i + 1) + ' · ' + esc(m.q.label) + '</button></li>'; }).join('') +
        '</ul></div>'
      : '';

    return '<header class="sec-head">' +
        '<p class="eyebrow">Son adım</p>' +
        '<h1 class="sec-title" tabindex="-1" data-focus-target>Yanıtlarınızı gözden geçirin</h1>' +
        '<p class="sec-intro">Göndermeden önce her bölümü kontrol edin. Bir şeyi değiştirmek isterseniz “Düzenle” ile o bölüme dönün. Yanıtlarınız korunur.</p>' +
      '</header>' +
      '<div class="rv-summary"><div><b>' + t.done + '<span style="font-size:18px;color:var(--ink-2);font-weight:500"> / ' + t.total + '</span></b><span>soru yanıtlandı</span></div>' +
        '<div><b>' + missing.length + '</b><span>eksik zorunlu soru</span></div>' +
        '<div><b>%' + t.pct + '</b><span>tamamlanma</span></div></div>' +
      callout + secs +
      '<div class="agree' + (state.agreeError ? ' invalid' : '') + '" id="agree-box">' +
        '<label class="opt"><input type="checkbox" id="confirm-accurate"' + (state.confirmed ? ' checked' : '') + ' aria-describedby="agree-msg"><span class="ind" aria-hidden="true"></span><span>Verdiğim bilgilerin, bildiğim kadarıyla doğru olduğunu onaylıyorum.</span></label>' +
        '<p class="agree-note">' + (CONFIG.submitEndpoint ? 'Formu gönderdiğinizde yanıtlarınız Studio Magik’e iletilir.' : 'Bu sürümde gönderim sunucusu bağlı değil. Gönderdiğinizde yanıtlarınız bu cihazda saklanır ve bir sonraki ekranda bize iletmeniz için kopyalanabilir.') + '</p>' +
        '<p class="form-msg" id="agree-msg" role="alert">' + (state.agreeError ? 'Göndermek için bu kutuyu işaretleyin.' : '') + '</p>' +
      '</div>';
  }

  /* ---------- visibility ---------- */
  function syncVisibility(animate) {
    if (typeof state.step !== 'number' || state.step >= N) return;
    var s = SECTIONS[state.step];
    s.questions.forEach(function (q) {
      var el = app.querySelector('[data-q="' + q.id + '"]');
      if (!el) return;
      var vis = visible(q);
      setCollapsed(el, !vis, animate);
      if (q.options && q.options.some(function (o) { return o.v === 'other'; })) {
        var cur = state.answers[q.id];
        var otherOn = Array.isArray(cur) ? cur.indexOf('other') > -1 : cur === 'other';
        var ow = el.querySelector('[data-other="' + q.id + '"]');
        if (ow) setCollapsed(ow, !otherOn, animate);
      }
      if (q.exclude) {
        var ex = q.exclude(state.answers);
        el.querySelectorAll('.opt').forEach(function (lab) {
          var hide = ex.indexOf(lab.getAttribute('data-v')) > -1;
          lab.hidden = hide;
          var inp = lab.querySelector('input');
          if (hide && inp.checked) {
            inp.checked = false;
            state.answers[q.id] = (state.answers[q.id] || []).filter(function (v) { return v !== inp.value; });
          }
        });
      }
    });
  }
  function setCollapsed(el, collapsed, animate) {
    if (!animate) {
      el.style.transition = 'none';
      var inner = el.firstElementChild;
      if (inner) inner.style.transition = 'none';
    }
    el.classList.toggle('collapsed', collapsed);
    el.inert = collapsed;
    if (!animate) {
      void el.offsetHeight;
      el.style.transition = '';
      if (el.firstElementChild) el.firstElementChild.style.transition = '';
    }
  }

  /* ---------- errors ---------- */
  function clearError(id) {
    var el = app.querySelector('[data-q="' + id + '"]');
    if (!el || !el.classList.contains('invalid')) return;
    el.classList.remove('invalid');
    el.querySelectorAll('[aria-invalid]').forEach(function (x) { x.removeAttribute('aria-invalid'); });
    var e = document.getElementById('e-' + id); if (e) e.textContent = '';
  }
  function showErrors(errs) {
    errs.forEach(function (er) {
      var el = app.querySelector('[data-q="' + er.q.id + '"]');
      if (!el) return;
      el.classList.add('invalid');
      var e = document.getElementById('e-' + er.q.id); if (e) e.textContent = er.msg;
      var f = el.querySelector('input:not([type=radio]):not([type=checkbox]), textarea');
      if (f) f.setAttribute('aria-invalid', 'true');
      else { var fs = el.querySelector('fieldset'); if (fs) fs.setAttribute('aria-invalid', 'true'); }
    });
    var first = errs[0] && app.querySelector('[data-q="' + errs[0].q.id + '"]');
    if (first) {
      first.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
      var target = first.querySelector('input:not([type=hidden]), textarea');
      if (target) setTimeout(function () { target.focus({ preventScroll: true }); }, reduceMotion() ? 0 : 300);
    }
    setActionMsg(errs.length === 1 ? '1 zorunlu soru eksik' : errs.length + ' soruda düzeltme gerekiyor', true);
  }
  function setActionMsg(text, isErr) {
    state.formMsg = isErr ? text : '';
    var el = document.getElementById('action-msg');
    if (el) { el.textContent = text; el.classList.toggle('msg', !!isErr); }
  }
  function reduceMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

  function autosize(t) {
    t.style.height = 'auto';
    t.style.height = Math.max(t.scrollHeight + 2, t.classList.contains('short') ? 64 : 104) + 'px';
  }

  /* =====================================================================
     Navigation
     ===================================================================== */
  function goTo(step, opts) {
    opts = opts || {};
    state.step = step;
    state.railOpen = false;
    state.formMsg = '';
    state.agreeError = false;
    if (typeof step === 'number') {
      if (step > state.furthest) state.furthest = step;
      if (step < N && state.visited.indexOf(step) < 0) state.visited.push(step);
      writeJSON(CONFIG.sessionKey, 1, 'session');
    }
    if (step === REVIEW) state.fromReview = false;
    render({ focusHeading: true });
    if (opts.focusQ) {
      var el = app.querySelector('[data-q="' + opts.focusQ + '"]');
      if (el) {
        el.scrollIntoView({ block: 'center' });
        var f = el.querySelector('input, textarea');
        if (f) f.focus({ preventScroll: true });
      }
    }
    saveNow();
  }

  function next() {
    var errs = sectionErrors(state.step);
    if (errs.length) { showErrors(errs); return; }
    goTo(state.fromReview ? REVIEW : nextStep(state.step));
  }
  function back() {
    var prev = prevStep(state.step === REVIEW ? N : state.step);
    if (prev < 0) { saveNow(); state.step = 'welcome'; removeKey(CONFIG.sessionKey, 'session'); render({ focusHeading: true }); }
    else goTo(prev);
  }

  async function submit() {
    var missing = [];
    SECTIONS.forEach(function (s, i) { missingRequired(i).forEach(function (q) { missing.push({ i: i, q: q }); }); });
    if (missing.length) {
      setActionMsg(missing.length + ' zorunlu soru eksik', true);
      var c = app.querySelector('.callout'); if (c) c.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
      return;
    }
    if (!state.confirmed) {
      state.agreeError = true;
      var box = document.getElementById('agree-box');
      box.classList.add('invalid');
      document.getElementById('agree-msg').textContent = 'Göndermek için bu kutuyu işaretleyin.';
      box.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
      document.getElementById('confirm-accurate').focus({ preventScroll: true });
      return;
    }
    state.submitting = true;
    var btn = app.querySelector('[data-act="submit"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Gönderiliyor…'; }
    var payload = buildPayload();
    try {
      var result = await submitResponses(payload);
      state.submission = { submittedAt: payload.submittedAt, delivered: result.delivered, mode: result.mode, answers: state.answers };
      writeJSON(CONFIG.submittedKey, state.submission);
      removeKey(CONFIG.draftKey);
      removeKey(CONFIG.sessionKey, 'session');
      state.submitting = false;
      state.step = 'done';
      render({ focusHeading: true });
    } catch (err) {
      state.submitting = false;
      if (btn) { btn.disabled = false; btn.textContent = 'Formu gönder'; }
      setActionMsg('Gönderilemedi. Bağlantınızı kontrol edip tekrar deneyin. Yanıtlarınız bu cihazda kayıtlı.', true);
    }
  }

  function buildPayload() {
    var visibleAnswers = {};
    var readable = SECTIONS.map(function (s, i) {
      var items = [];
      visibleQs(i).forEach(function (q) {
        if (!answered(q)) return;
        visibleAnswers[q.id] = state.answers[q.id];
        if (state.answers[q.id + '__other']) visibleAnswers[q.id + '__other'] = state.answers[q.id + '__other'];
        items.push({ id: q.id, question: q.label, answer: displayValue(q) });
      });
      return { section: s.title, items: items };
    });
    return {
      formId: CONFIG.formId,
      version: CONFIG.formVersion,
      locale: 'tr',
      submittedAt: Date.now(),
      company: state.answers.company || '',
      contact: state.answers.contact || '',
      answers: visibleAnswers,
      readable: readable,
      text: answersText()
    };
  }

  function answersText() {
    var ans = state.submission ? state.submission.answers : state.answers;
    var prev = state.answers; state.answers = ans;
    var lines = ['Studio Magik · Web sitesi keşif formu', (ans.company || '') + (state.submission ? ' · ' + longDate(state.submission.submittedAt) : ''), ''];
    SECTIONS.forEach(function (s, i) {
      var qs = visibleQs(i).filter(answered);
      if (!qs.length) return;
      lines.push(pad(i + 1) + ' ' + s.title.toLocaleUpperCase('tr-TR'));
      qs.forEach(function (q) { lines.push('• ' + q.label); lines.push('  ' + displayValue(q).replace(/\n/g, '\n  ')); });
      lines.push('');
    });
    state.answers = prev;
    return lines.join('\n');
  }

  async function copyAnswers() {
    var note = document.getElementById('copy-note');
    var text = answersText();
    try {
      await navigator.clipboard.writeText(text);
      if (note) note.textContent = 'Kopyalandı. E-postanıza ya da mesajınıza yapıştırabilirsiniz.';
    } catch (e) {
      state.copyFallback = true;
      render({ scroll: false });
      var ta = document.getElementById('copy-area');
      if (ta) { ta.focus(); ta.select(); }
      var n2 = document.getElementById('copy-note');
      if (n2) n2.textContent = 'Otomatik kopyalanamadı. Metin seçildi, kopyalamak için Cmd+C ya da Ctrl+C kullanın.';
    }
  }

  /* =====================================================================
     Events
     ===================================================================== */
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act], [data-goto], [data-edit]');
    if (!t) return;
    if (t.hasAttribute('data-goto')) { var g = +t.getAttribute('data-goto'); if (g !== state.step) goTo(g); else { state.railOpen = false; render({ scroll: false }); } return; }
    if (t.hasAttribute('data-edit')) {
      state.fromReview = true;
      var i = +t.getAttribute('data-edit');
      state.step = null;
      goTo(i, { focusQ: t.getAttribute('data-focus-q') });
      state.fromReview = true;
      var nb = app.querySelector('[data-act="next"]');
      if (nb) nb.outerHTML = '<button class="btn btn-solid" type="button" data-act="next">Gözden geçirmeye dön ' + ICON.arrowR + '</button>';
      return;
    }
    switch (t.getAttribute('data-act')) {
      case 'start':
        state.answers = {}; state.visited = []; state.furthest = -1; state.fromReview = false;
        goTo(0); break;
      case 'resume': {
        var d = readJSON(CONFIG.draftKey) || {};
        state.answers = d.answers || {}; state.visited = d.visited || []; state.furthest = typeof d.furthest === 'number' ? d.furthest : 0;
        state.savedAt = d.updatedAt || null;
        goTo(typeof d.step === 'number' ? d.step : 0); break;
      }
      case 'discard': state.confirmDiscard = true; render({ scroll: false }); app.querySelector('[data-act="discard-yes"]').focus(); break;
      case 'discard-no': state.confirmDiscard = false; render({ scroll: false }); break;
      case 'discard-yes':
        removeKey(CONFIG.draftKey); state.confirmDiscard = false; state.answers = {}; state.visited = []; state.furthest = -1; state.savedAt = null;
        render({ scroll: false }); var sb = app.querySelector('[data-act="start"]'); if (sb) sb.focus(); break;
      case 'next': next(); break;
      case 'back': back(); break;
      case 'submit': submit(); break;
      case 'rail-open': state.railOpen = true; document.getElementById('rail').classList.add('open'); t.setAttribute('aria-expanded', 'true'); var cb = app.querySelector('[data-act="rail-close"]'); if (cb) cb.focus(); break;
      case 'rail-close': state.railOpen = false; document.getElementById('rail').classList.remove('open'); var ob = app.querySelector('[data-act="rail-open"]'); if (ob) { ob.setAttribute('aria-expanded', 'false'); ob.focus(); } break;
      case 'copy': copyAnswers(); break;
      case 'new':
        removeKey(CONFIG.submittedKey);
        state.submission = null; state.answers = {}; state.visited = []; state.furthest = -1; state.confirmed = false; state.copyFallback = false; state.savedAt = null;
        state.step = 'welcome'; render({ focusHeading: true }); break;
    }
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    var key = t.getAttribute('data-key');
    if (!key) return;
    state.answers[key] = t.value;
    if (t.tagName === 'TEXTAREA') autosize(t);
    clearError(key.replace(/__other$/, ''));
    if (state.formMsg) setActionMsg(typeof state.step === 'number' && state.step < N ? 'Bölüm ' + (state.step + 1) + ' / ' + N : '', false);
    if (t.type === 'date') syncVisibility(true);
    paintProgress();
    scheduleSave();
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'confirm-accurate') {
      state.confirmed = t.checked;
      if (t.checked) { state.agreeError = false; document.getElementById('agree-box').classList.remove('invalid'); document.getElementById('agree-msg').textContent = ''; }
      return;
    }
    if (t.type !== 'radio' && t.type !== 'checkbox') return;
    var id = t.name;
    var q = findQ(id);
    if (!q) return;
    if (t.type === 'radio') {
      state.answers[id] = t.value;
    } else {
      if (q.exclusive && t.checked) {
        app.querySelectorAll('input[name="' + id + '"]').forEach(function (x) {
          if (t.value === q.exclusive ? x !== t : x.value === q.exclusive) x.checked = false;
        });
      }
      state.answers[id] = Array.prototype.map.call(app.querySelectorAll('input[name="' + id + '"]:checked'), function (x) { return x.value; });
    }
    clearError(id);
    if (state.formMsg) setActionMsg('Bölüm ' + (state.step + 1) + ' / ' + N, false);
    syncVisibility(true);
    if (t.value === 'other' && t.checked) {
      var o = document.getElementById(id + '__other');
      if (o) setTimeout(function () { o.focus({ preventScroll: true }); }, 60);
    }
    paintProgress();
    scheduleSave();
  });

  app.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && typeof state.step === 'number') {
      e.preventDefault();
      if (state.step === REVIEW) submit(); else next();
    }
    if (e.key === 'Escape' && state.railOpen) {
      var cb = app.querySelector('[data-act="rail-close"]'); if (cb) cb.click();
    }
  });

  window.addEventListener('pagehide', function () { if (saveTimer) saveNow(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && saveTimer) saveNow(); });

  function findQ(id) {
    for (var i = 0; i < SECTIONS.length; i++) {
      for (var j = 0; j < SECTIONS[i].questions.length; j++) if (SECTIONS[i].questions[j].id === id) return SECTIONS[i].questions[j];
    }
    return null;
  }

  /* =====================================================================
     Boot: a refresh mid-form returns to the same step; a later visit
     lands on the welcome screen with a resume card.
     ===================================================================== */
  document.documentElement.lang = 'tr';
  (function boot() {
    state.storageOk = !!store('local') && writeJSON('magik-discovery:probe', 1) && (removeKey('magik-discovery:probe'), true);
    var draft = readJSON(CONFIG.draftKey);
    var submitted = readJSON(CONFIG.submittedKey);
    var active = readJSON(CONFIG.sessionKey, 'session');
    if (draft && active && typeof draft.step === 'number') {
      state.answers = draft.answers || {};
      state.visited = draft.visited || [];
      state.furthest = typeof draft.furthest === 'number' ? draft.furthest : draft.step;
      state.savedAt = draft.updatedAt || null;
      state.step = draft.step;
    } else if (!draft && submitted) {
      state.submission = submitted;
      state.step = 'done';
    }
    render();
  })();
})();
</script>
